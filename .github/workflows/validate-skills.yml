name: Validate agent skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate skill format
        run: |
          python -m pip install skills-ref==0.1.1
          agentskills validate skills/avileo-catalog
          agentskills validate skills/avileo-key-routing
      - name: Discover installable skills
        run: |
          npx --yes skills add . --skill avileo-catalog --list
          npx --yes skills add . --skill avileo-key-routing --list
